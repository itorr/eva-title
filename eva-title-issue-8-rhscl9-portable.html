<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="https://lab.magiconch.com/eva-title/">
<title>EVA 标题生成器 · 字形测试 #8</title>
<link rel="stylesheet" href="i.css?r=rhscl9">
<style>
    html { font-size: 16px; }
    body {
        margin: 0 auto;
        max-width: 48rem;
        padding: 1.25rem;
    }
    h1 { margin-bottom: 1rem; font-size: 1.5rem; }
    h1 a { color: inherit; }
    label, canvas { display: block; }
    textarea {
        box-sizing: border-box;
        width: 100%;
        margin: .5rem 0;
        padding: .75rem;
        border: 2px solid currentColor;
        background: var(--color-background);
        color: inherit;
        letter-spacing: .12em;
        resize: vertical;
    }
    textarea:focus-visible { border-color: var(--color-red); }
    canvas { width: 100%; height: auto; background: #000; }
    [v-cloak] { visibility: hidden; }
    .status { min-height: 1.5em; }
</style>
<h1>EVA 字形测试 <a href="https://github.com/itorr/eva-title/issues/8">#8</a></h1>
<form id="test">
    <label for="sample">测试字符（98 个）</label>
    <textarea id="sample" rows="7" spellcheck="false" required>丢儞嬭祢袮㚷你妳伱螈瞪趕巢翎
脫呦菀澔褚琚脖琬蓂娣霂溫黃媳
噩婕楣翟歷璐噶嘎蒯幫鑫憨懂罄
齁糙雩淚佔仿另內份涉玷宊圳‼
ཚ✧步弎芷沅芮彤狀莘玫炕邢砰
啡俏琰柰吧罡掐帕琨爸捂晌郝跤
咖痹棱彥烔姝歆渴淩姬虛摔盼嘿</textarea>
    <button id="render" class="btn current" type="submit" disabled>生成预览</button>
</form>
<p id="error" role="alert" hidden>线上发布版加载失败，请检查网络后刷新。</p>
<div class="app" v-cloak>
    <p class="status" role="status">{{ loading ? '正在加载字体…' : '' }}</p>
    <canvas ref="canvas" width="960" height="640" aria-label="线上发布版字形预览"></canvas>
</div>
<script src="https://lab.magiconch.com/vue.2.6.11.min.js"></script>
<script src="https://lab.magiconch.com/eva-title/c.js?r=rhscl9"></script>
<script>
    const form = document.getElementById('test');
    const sample = document.getElementById('sample');
    const render = document.getElementById('render');

    if (typeof app === 'undefined') {
        document.getElementById('error').hidden = false;
    } else {
        // 本地打开时，发布版应继续请求线上字体接口。
        fontAPI = 'https://lab.magiconch.com/api/fontmin';

        const columns = 14;
        const testLayout = {
            id: 'e1',
            title: 'EVA 字形测试 #8',
            inputs: [{ placeholder: '' }],
            config: { height: 320, outputRatio: 1.5, blur: false, noise: false, shadow: false },
            make({ ctx, texts, config: { width, height, padding }, functions: { setCtxConfig } }) {
                const characters = Array.from(texts[0].replace(/\s/g, ''));
                const rows = Math.max(1, Math.ceil(characters.length / columns));
                const cellWidth = (width - padding * 2) / columns;
                const cellHeight = Math.min(cellWidth, (height - padding * 2) / rows);

                setCtxConfig(ctx, { fontSize: Math.floor(cellHeight * .72) });
                ctx.textAlign = 'center';
                characters.forEach((character, index) => {
                    const x = padding + (index % columns + .5) * cellWidth;
                    const y = padding + (Math.floor(index / columns) + .5) * cellHeight;
                    ctx.fillText(character, x, y);
                });
            }
        };

        const generate = () => app.setExemple([sample.value]);
        const stopWatching = app.$watch('layouts', () => {
            stopWatching();
            app.setLayout(testLayout, true);
            generate();
            render.disabled = false;
        });
        form.addEventListener('submit', event => {
            event.preventDefault();
            generate();
        });
    }
</script>
</html>
